<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gunita: Reaper of Echoes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a14;
        --bg2: #12121e;
        --bg3: #1a1a2e;
        --purple-dark: #1e0a3c;
        --purple: #4a1e8a;
        --purple-mid: #7c3fcf;
        --purple-light: #b57fee;
        --purple-pale: #e0c8ff;
        --gold: #f0c060;
        --gold-dark: #a07830;
        --teal: #2dd4bf;
        --teal-dark: #0f766e;
        --red: #e55c5c;
        --text: #e8d8f8;
        --text-dim: #9880b8;
        --pixel: 2px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
