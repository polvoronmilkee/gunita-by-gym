<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gunita: Reaper of Echoes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a14;
        --purple-pale: #e0c8ff;
        --teal: #2dd4bf;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--bg);
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }

      #menu-screen {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #05050c url('/src/assets/main-menu/main-menu-bg.png') no-repeat center center;
        background-size: cover;
        z-index: 5;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      #menu-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* 16:9 aspect-ratio locking container that always fits on screen */
      .menu-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        max-width: 177.78vh; /* 16/9 aspect-ratio width limit */
        max-height: 56.25vw; /* 9/16 aspect-ratio height limit */
        box-sizing: border-box;
      }

      /* Lower Left: Tagline overlay */
      .menu-tagline {
        position: absolute;
        bottom: -1%;
        left: -14%;
        width: 77%;
        height: 12%;
        /* max-height: 8%; */
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      /* Top Right Panel: Title Logo & Navigation Buttons */
      .right-panel {
        position: absolute;
        top: -3%;
        right: 0%;
        width: 44%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .menu-logo {
        width: 120%;
        height: auto;
        object-fit: contain;
        margin-bottom: 4%;
        user-select: none;
        pointer-events: none;
      }

      .menu-buttons {
        width: 85%;
        display: flex;
        margin-right: 7%;
        flex-direction: column;
        gap: clamp(8px, 1.2vh, 16px);
        margin-top: 15%
      }

      .menu-btn {
        appearance: none;
        border: 2px solid rgba(124, 63, 207, 0.35);
        background: rgba(5, 5, 12, 0.75);
        color: #d0e8ff;
        font-family: "Press Start 2P", monospace;
        font-size: clamp(8px, 1vw, 15px);
        padding: clamp(8px, 1.2vw, 18px) 0;
        width: 100%;
        cursor: pointer;
        text-align: center;
        letter-spacing: 2px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        transition: all 200ms ease;
        user-select: none;
      }

      .menu-btn:hover {
        border-color: var(--teal);
        color: #ffffff;
        background: rgba(12, 12, 24, 0.85);
        text-shadow: 0 0 8px rgba(45, 212, 191, 0.85);
        box-shadow: 
          0 0 15px rgba(45, 212, 191, 0.3),
          inset 0 0 10px rgba(45, 212, 191, 0.1);
        transform: translateY(-2px);
      }

      .menu-btn:active {
        transform: translateY(1px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
      }

      #game-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      #game-shell.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.025) 0,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div class="scanlines"></div>

    <div id="menu-screen">
      <div class="menu-container">
        <!-- Tagline bottom-left -->
        <img class="menu-tagline" src="/src/assets/main-menu/tagline.png" alt="The dead have stories to tell. Will you listen?" />

        <!-- Logo and buttons top-right -->
        <div class="right-panel">
          <img class="menu-logo" src="/src/assets/main-menu/gunita-text-glowing-2.png" alt="GUNITA: The Reaper of Echoes" />
          <div class="menu-buttons">
            <button class="menu-btn" id="continue-journey">CONTINUE JOURNEY</button>
            <button class="menu-btn" id="start-reaping">START REAPING</button>
            <button class="menu-btn" id="menu-options">OPTIONS</button>
            <button class="menu-btn" id="menu-about">ABOUT</button>
          </div>
        </div>
      </div>
    </div>

    <div id="game-shell" class="hidden">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
