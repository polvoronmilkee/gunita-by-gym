<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gunita: Reaper of Echoes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a14;
        --purple-pale: #e0c8ff;
        --teal: #2dd4bf;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--bg);
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }

      #menu-screen {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #05050c url('/src/assets/main-menu/main-menu-bg.png') no-repeat center center;
        background-size: cover;
        z-index: 5;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      .menu-light-orb,
      .menu-light-rim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }

      .menu-light-orb {
        background:
          radial-gradient(circle at 52% 44%, rgba(74, 234, 255, 0.26) 0%, rgba(74, 234, 255, 0.14) 16%, rgba(74, 234, 255, 0.04) 32%, transparent 58%),
          radial-gradient(circle at 55% 48%, rgba(255, 255, 255, 0.08) 0%, transparent 18%);
        filter: blur(18px);
        mix-blend-mode: screen;
        opacity: 0.75;
        animation: menuLightPulse 6.5s ease-in-out infinite;
      }

      .menu-light-rim {
        background:
          radial-gradient(circle at 52% 48%, transparent 44%, rgba(120, 220, 255, 0.12) 52%, transparent 67%),
          radial-gradient(circle at 49% 39%, rgba(255, 255, 255, 0.05) 0%, transparent 22%);
        filter: blur(12px);
        mix-blend-mode: screen;
        opacity: 0.55;
        animation: menuLightDrift 10s ease-in-out infinite;
      }

      @keyframes menuLightPulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.98);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.04);
        }
      }

      @keyframes menuLightDrift {
        0%,
        100% {
          opacity: 0.45;
          transform: translate3d(-0.6%, -0.3%, 0);
        }
        50% {
          opacity: 0.72;
          transform: translate3d(0.8%, 0.5%, 0);
        }
      }

      #menu-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* 16:9 aspect-ratio locking container that always fits on screen */
      .menu-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        max-width: 177.78vh; /* 16/9 aspect-ratio width limit */
        max-height: 56.25vw; /* 9/16 aspect-ratio height limit */
        box-sizing: border-box;
      }

      /* Lower Left: Tagline overlay */
      .menu-tagline {
        position: absolute;
        bottom: -1%;
        left: -14%;
        width: 77%;
        height: 12%;
        /* max-height: 8%; */
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      /* Top Right Panel: Title Logo & Navigation Buttons */
      .right-panel {
        position: absolute;
        top: -3%;
        right: 0%;
        width: 44%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .menu-logo {
        width: 120%;
        height: auto;
        object-fit: contain;
        margin-bottom: 4%;
        user-select: none;
        pointer-events: none;
      }

      .menu-buttons {
        width: 85%;
        display: flex;
        margin-right: 7%;
        flex-direction: column;
        gap: clamp(8px, 1.2vh, 16px);
        margin-top: 15%
      }

      .menu-audio-controls {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 7;
        display: flex;
        gap: 8px;
      }

      .menu-audio-btn {
        appearance: none;
        border: 2px solid rgba(124, 63, 207, 0.35);
        background: rgba(5, 5, 12, 0.75);
        color: #d0e8ff;
        width: 46px;
        height: 46px;
        border-radius: 10px;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        transition: all 200ms ease;
      }

      .menu-audio-btn:hover {
        border-color: var(--teal);
        background: rgba(12, 12, 24, 0.85);
        box-shadow:
          0 0 15px rgba(45, 212, 191, 0.3),
          inset 0 0 10px rgba(45, 212, 191, 0.1);
        transform: translateY(-2px);
      }

      .menu-audio-btn:active {
        transform: translateY(1px);
      }

      .menu-btn {
        appearance: none;
        border: 2px solid rgba(124, 63, 207, 0.35);
        background: rgba(5, 5, 12, 0.75);
        color: #d0e8ff;
        font-family: "Press Start 2P", monospace;
        font-size: clamp(8px, 1vw, 15px);
        padding: clamp(8px, 1.2vw, 18px) 0;
        width: 90%;
        cursor: pointer;
        text-align: center;
        letter-spacing: 2px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        transition: all 200ms ease;
        user-select: none;
      }

      .menu-btn:hover {
        border-color: var(--teal);
        color: #ffffff;
        background: rgba(12, 12, 24, 0.85);
        text-shadow: 0 0 8px rgba(45, 212, 191, 0.85);
        box-shadow: 
          0 0 15px rgba(45, 212, 191, 0.3),
          inset 0 0 10px rgba(45, 212, 191, 0.1);
        transform: translateY(-2px);
      }

      .menu-btn:active {
        transform: translateY(1px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
      }

      #game-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      #game-shell.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.025) 0,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
        z-index: 6;
      }

      /* Gunita Themed Codenames Modal */
      .gunita-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 5, 12, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 1;
        transition: opacity 200ms ease;
      }

      .gunita-modal-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .gunita-modal {
        background: #000000;
        border: 4px solid #ffffff;
        padding: 6px;
        box-shadow: 
          0 8px 0 -4px #000000, 
          0 12px 24px rgba(0, 0, 0, 0.8),
          0 0 15px rgba(176, 126, 255, 0.3);
        width: min(90vw, 420px);
        box-sizing: border-box;
        font-family: 'Press Start 2P', monospace;
        position: relative;
      }

      .gunita-modal__close-x {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #ffffff;
        font-family: 'Press Start 2P', monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 200ms ease;
        line-height: 1;
        padding: 4px;
        z-index: 10;
      }

      .gunita-modal__close-x:hover {
        color: #ff5555;
        text-shadow: 0 0 5px #ff5555;
      }

      .gunita-modal__btn--confirm-centered {
        appearance: none;
        border: 2px solid rgba(124, 63, 207, 0.35);
        background: rgba(5, 5, 12, 0.75);
        color: #d0e8ff;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        padding: 12px 0;
        width: 60%;
        cursor: pointer;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        transition: all 200ms ease;
        user-select: none;
        margin-top: 6px;
      }

      .gunita-modal__btn--confirm-centered:hover {
        border-color: var(--teal);
        color: #ffffff;
        background: rgba(12, 12, 24, 0.85);
        text-shadow: 0 0 8px rgba(45, 212, 191, 0.85);
      }

      .gunita-modal__inner {
        border: 3px solid #ffffff;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
      }

      .gunita-modal__title {
        color: #b57fee; /* Purple accent */
        font-size: clamp(10px, 1vw, 14px);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0 0 8px 0;
      }

      .gunita-modal__input {
        width: 90%;
        background: #000000;
        border: 3px solid #ffffff;
        color: #ffffff;
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        padding: 10px;
        text-align: center;
        outline: none;
        text-transform: uppercase;
      }

      .gunita-modal__input:focus {
        border-color: var(--teal);
        color: #2dd4bf; /* Mint/cyan accent on focus */
      }

      .gunita-modal__actions {
        display: flex;
        width: 100%;
        gap: 12px;
        justify-content: center;
        margin-top: 6px;
      }

      .gunita-modal__btn {
        appearance: none;
        border: 2px solid rgba(124, 63, 207, 0.35);
        background: rgba(5, 5, 12, 0.75);
        color: #d0e8ff;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        padding: 12px 0;
        width: 45%;
        cursor: pointer;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        transition: all 200ms ease;
        user-select: none;
      }

      .gunita-modal__btn:hover {
        border-color: var(--teal);
        color: #ffffff;
        background: rgba(12, 12, 24, 0.85);
        text-shadow: 0 0 8px rgba(45, 212, 191, 0.85);
      }

      .gunita-modal__cancel-link {
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        color: #ff5555;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: underline;
        margin-top: 4px;
      }

      .gunita-modal__cancel-link:hover {
        text-shadow: 0 0 5px #ff5555;
      }

      .gunita-modal__error {
        font-family: 'VT323', monospace;
        font-size: 20px;
        color: #ff5c5c;
        min-height: 24px;
        text-align: center;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="scanlines"></div>

    <div id="menu-screen" class="hidden">
      <div class="menu-light-orb" aria-hidden="true"></div>
      <div class="menu-light-rim" aria-hidden="true"></div>
      <div class="menu-audio-controls" aria-label="Audio controls">
        <button class="menu-audio-btn" id="menu-sfx-toggle" type="button" aria-label="Sound effects toggle" title="SFX"></button>
        <button class="menu-audio-btn" id="menu-music-toggle" type="button" aria-label="Music toggle" title="MUSIC"></button>
      </div>
      <div class="menu-container">
        <!-- Tagline bottom-left -->
        <img class="menu-tagline" src="/src/assets/main-menu/tagline.png" alt="The dead have stories to tell. Will you listen?" />

        <!-- Logo and buttons top-right -->
        <div class="right-panel">
          <img class="menu-logo" src="/src/assets/main-menu/gunita-text-glowing-2.png" alt="GUNITA: The Reaper of Echoes" />
          <div class="menu-buttons">
            <button class="menu-btn" id="continue-journey">CONTINUE JOURNEY</button>
            <button class="menu-btn" id="enter-campo-lunan">START AGAIN</button>
            <button class="menu-btn" id="tale-untold">ENTER CAMPO LUNAN</button>
            <button class="menu-btn" id="menu-guide">SURVIVAL GUIDE</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Continue Journey Modal Overlay (Gunita Theme) -->
    <div id="continue-journey-modal" class="gunita-modal-overlay hidden">
      <div class="gunita-modal">
        <!-- Close (X) button in top-right -->
        <button id="continue-modal-close-btn" class="gunita-modal__close-x">X</button>
        <div class="gunita-modal__inner">
          <h2 class="gunita-modal__title">CONTINUE JOURNEY</h2>
          <input type="text" id="continue-username-input" class="gunita-modal__input" placeholder="ENTER CODENAME" maxlength="15" />
          <!-- Confirm button in middle bottom -->
          <button id="continue-modal-confirm-btn" class="gunita-modal__btn--confirm-centered">CONFIRM</button>
          <div id="continue-modal-error" class="gunita-modal__error"></div>
        </div>
      </div>
    </div>

    <!-- New Journey Modal Overlay (Gunita Theme) -->
    <div id="new-journey-modal" class="gunita-modal-overlay hidden">
      <div class="gunita-modal">
        <div class="gunita-modal__inner">
          <h2 class="gunita-modal__title">START NEW JOURNEY</h2>
          <input type="text" id="new-username-input" class="gunita-modal__input" placeholder="ENTER CODENAME" maxlength="15" />
          <div class="gunita-modal__actions">
            <button id="new-modal-confirm-btn" class="gunita-modal__btn">CONFIRM</button>
            <button id="new-modal-cancel-btn" class="gunita-modal__btn">CANCEL</button>
          </div>
          <div id="new-modal-error" class="gunita-modal__error"></div>
        </div>
      </div>
    </div>

    <div id="game-shell" class="hidden">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
