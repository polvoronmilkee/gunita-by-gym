<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gunita: Reaper of Echoes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a14;
        --bg2: #12121e;
        --bg3: #1a1a2e;
        --purple-dark: #1e0a3c;
        --purple: #4a1e8a;
        --purple-mid: #7c3fcf;
        --purple-light: #b57fee;
        --purple-pale: #e0c8ff;
        --gold: #f0c060;
        --gold-dark: #a07830;
        --teal: #2dd4bf;
        --teal-dark: #0f766e;
        --red: #e55c5c;
        --text: #e8d8f8;
        --text-dim: #9880b8;
        --pixel: 2px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      #menu-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 50% 20%, rgba(181, 127, 238, 0.14), transparent 35%),
          radial-gradient(circle at 70% 22%, rgba(240, 192, 96, 0.08), transparent 20%),
          linear-gradient(180deg, #05050c 0%, #0a0a14 46%, #12121e 100%);
        color: var(--text);
        z-index: 5;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      #menu-screen.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 420ms ease;
      }

      .menu-shell {
        width: min(940px, 100%);
        border: 2px solid var(--purple);
        background: rgba(18, 18, 30, 0.92);
        box-shadow:
          0 0 0 2px rgba(30, 10, 60, 0.7),
          0 22px 60px rgba(0, 0, 0, 0.55);
        padding: 42px 32px 30px;
        text-align: center;
        position: relative;
      }

      .menu-shell::before,
      .menu-shell::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(181, 127, 238, 0.12);
        pointer-events: none;
      }

      .menu-title {
        font-family: "Press Start 2P", monospace;
        font-size: clamp(24px, 5vw, 52px);
        color: var(--purple-pale);
        text-shadow: 4px 4px 0 var(--purple), 8px 8px 0 rgba(74, 30, 138, 0.5);
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .menu-subtitle {
        font-family: "Press Start 2P", monospace;
        font-size: clamp(9px, 2vw, 13px);
        color: var(--gold);
        margin-bottom: 28px;
        letter-spacing: 1px;
      }

      .menu-tagline {
        font-size: 34px;
        color: var(--text-dim);
        margin-bottom: 10px;
      }

      .menu-tagline-2 {
        font-size: 32px;
        color: var(--purple-light);
        margin-bottom: 36px;
      }

      .menu-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .menu-button {
        appearance: none;
        border: none;
        cursor: pointer;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        padding: 16px 28px;
        color: var(--purple-pale);
        background: var(--purple);
        box-shadow: 4px 4px 0 var(--purple-dark), inset 0 -2px 0 rgba(0, 0, 0, 0.4);
        transition:
          transform 140ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease,
          color 180ms ease;
      }

      .menu-button:hover {
        background: var(--purple-mid);
        box-shadow: 4px 4px 0 var(--purple-dark), 0 0 0 2px rgba(181, 127, 238, 0.2), 0 0 24px rgba(124, 63, 207, 0.35);
        transform: translateY(-1px);
      }

      .menu-button:active {
        transform: translate(2px, 2px);
      }

      .menu-note {
        margin-top: 24px;
        font-size: 24px;
        color: var(--text-dim);
      }

      .menu-quick-hint {
        margin-top: 12px;
        font-size: 20px;
        color: var(--purple-light);
      }

      #game-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      #game-shell.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.025) 0,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div class="scanlines"></div>

    <div id="menu-screen">
      <div class="menu-shell">
        <div class="menu-title">GUNITA</div>
        <div class="menu-subtitle">Reaper of Echoes</div>
        <div class="menu-tagline">The dead have stories to tell. Will you listen?</div>
        <div class="menu-tagline-2">Their stories end with you.</div>

        <div class="menu-buttons">
          <button class="menu-button" id="start-journey">Start Journey</button>
        </div>

        <div class="menu-note">Use the menu to begin the journey through Campo Lunan.</div>
        <div class="menu-quick-hint">Press Start Journey to enter the game.</div>
      </div>
    </div>

    <div id="game-shell" class="hidden">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
